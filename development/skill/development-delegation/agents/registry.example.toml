# Optional identity binding examples, not a mandatory team or registration prerequisite.
# Dynamic mode may assign role modules to an authorized capable generic host agent.
# Copy role TOMLs into the deployment's `agents/` directory, then copy these declarations into its Codex `config.toml`.
# Relative config_file paths resolve from that config.toml.
# Registered role TOMLs are authoritative for model/provider routing. Codex/OpenCodex owns runtime route
# resolution and dispatch; this skill does not maintain a second static readiness model.
# All template execution settings are examples; actual owner registrations remain authoritative.
# codebase-memory-scout is the optional graph-scout identity: register it only when a
# Codebase Memory MCP server is available, and expect its read-only packet shape in
# references/graph-evidence-packet.md.

[agents.scout]
description = "Read-only source locator and evidence digest. Returns bounded findings, sources and gaps without implementation."
config_file = "./agents/scout.toml"

[agents.scout-deepseek]
description = "Read-only source locator and evidence digest using the configured DeepSeek route. Returns bounded findings, sources and gaps."
config_file = "./agents/scout-deepseek.toml"

[agents.codebase-memory-scout]
description = "Read-only Codebase Memory scout for provisional structural discovery when the relevant files or symbols are not yet known. Returns a bounded graph evidence packet."
config_file = "./agents/codebase-memory-scout.toml"

[agents.planner]
description = "High-reasoning planner. Converts a prepared evidence packet into a bounded executable plan or precise evidence requests."
config_file = "./agents/planner.toml"

[agents.implementer]
description = "Bounded code implementer. Changes only the brief scope; performs explicitly assigned checks or hands off validation."
config_file = "./agents/implementer.toml"

[agents.implementer-deepseek]
description = "Bounded code implementer using the configured DeepSeek runtime route. Changes only the brief scope; performs explicitly assigned checks or hands off validation."
config_file = "./agents/implementer-deepseek.toml"

[agents.tester]
description = "Bounded test author or validation executor. Defaults to execution; never repairs production code."
config_file = "./agents/tester.toml"

[agents.tester-deepseek]
description = "Bounded test author or validation executor using the configured DeepSeek route. Defaults to execution; never repairs production code."
config_file = "./agents/tester-deepseek.toml"

[agents.reviewer]
description = "Independent read-only reviewer for policy-selected plan and delivery boundaries, including mandatory high-risk review."
config_file = "./agents/reviewer.toml"
