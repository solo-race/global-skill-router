# Copy role TOMLs into the deployment's `agents/` directory, then copy these declarations into its Codex `config.toml`.
# Relative config_file paths resolve from that config.toml.
# DeepSeek profiles select the Codex Router route slug deepseek/deepseek-v4.1-flash.
# The Router maps that slug to the upstream model ID deepseek-flash; it is not a Codex-facing model name.
# The active Codex provider must point to an installed/authenticated loopback Router whose local catalog
# advertises this exact route with multi_agent_version = "v2". Preflight the route before offering these roles.
# reviewer.toml intentionally leaves its model/provider settings to the deployment.

[agents.scout]
description = "Read-only repository and document scout. Returns source-backed evidence without implementation."
config_file = "./agents/scout.toml"

[agents.scout-deepseek]
description = "Read-only repository and document scout using the DeepSeek route through Codex Router. Returns source-backed evidence without implementation."
config_file = "./agents/scout-deepseek.toml"

[agents.planner]
description = "High-reasoning planner. Converts a prepared evidence packet into a master/current-phase plan or precise evidence requests."
config_file = "./agents/planner.toml"

[agents.implementer]
description = "Bounded code implementer. Changes only the prepared implementation scope; validation is external."
config_file = "./agents/implementer.toml"

[agents.implementer-deepseek]
description = "Bounded code implementer using the DeepSeek route through Codex Router. Changes only the prepared implementation scope; validation is external."
config_file = "./agents/implementer-deepseek.toml"

[agents.tester]
description = "External validation executor. Runs requested checks and reports reproducible evidence without repairing failures."
config_file = "./agents/tester.toml"

[agents.tester-deepseek]
description = "External validation executor using the DeepSeek route through Codex Router. Runs requested checks and reports reproducible evidence without repairing failures."
config_file = "./agents/tester-deepseek.toml"

[agents.reviewer]
description = "Independent read-only reviewer for unattended phase close and optional unattended plan review. Model/provider may be selected by deployment or OMP."
config_file = "./agents/reviewer.toml"
