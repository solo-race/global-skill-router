# Domain profile: recycling-company
# First formal profile of research-investigation (plan 020 §5). It carries the migrated
# investigation capability of the original read-only reference skill; it is an instance
# of the profile contract and never a source of Core definitions.

profile_schema_version: 1
domain: recycling-company
subject_type: company

investigation_dimensions:
  - id: identity-and-facilities
    purpose: Establish legal identity, trading names, group relationships, locations, permits,
      and plant/site footprint so every later claim attaches to the right subject.
  - id: material-inputs
    purpose: Determine which streams enter the company — post-industrial or post-consumer
      plastics, WEEE, ELV, appliances, municipal or industrial streams — and how material enters;
      this changes screening relevance.
  - id: processing-operations
    purpose: Establish which physical operations happen in-house (collection, transport,
      dismantling, sorting, shredding, washing, separation, extrusion, pelletizing); separates
      processors from traders.
  - id: outputs-and-boundaries
    purpose: Identify products and fractions leaving the company (flakes, regrind, pellets,
      compounds, sorted fractions) plus disposal and transfers to downstream processors;
      distinguishes producers from intermediaries.
  - id: equipment-and-relationships
    purpose: Capture explicitly named machinery, installation references, suppliers, customers,
      contractors, and commissioning evidence; feeds the relevance hypothesis and partnership
      claims.
  - id: scale-and-change
    purpose: Track capacity, investment, new facilities, automation, and recent expansion signals
      that can change review conclusions over time.

concept_groups:
  identity-and-facilities:
    [company, legal entity, group, subsidiary, facility, plant, site, factory, location,
    official website, permit, environmental license, registry]
  business-and-material-inputs:
    [waste management, waste collection, waste treatment, recycling, material recovery,
    profile manufacturer, pvc profile manufacturer, plastic waste, mixed rigid plastics,
    post-consumer plastic, post-industrial scrap, WEEE, pvc profile, pvc profiles,
    demolished pvc profile, e-waste, ELV, automotive plastics, white goods, appliance plastics,
    refrigerator plastics]
  processing-operations:
    [dismantling, manual sorting, automated sorting, shredding, crushing, grinding, screening,
    magnetic separation, eddy current, air separation, optical sorting, density separation,
    sink float, electrostatic separation, washing, friction washing, drying, extrusion,
    pelletizing, compounding]
  materials-and-outputs:
    [ABS, HIPS, PS, PP, PE, HDPE, LDPE, PVC, PET, PC, PA, PMMA, flakes, regrind, pellets,
    recycled resin, compound, sorted fraction, mixed fraction, downstream processor,
    pvc profiles, final destination, outsourced processing]
  equipment-suppliers-and-change:
    [recycling line, sorting line, shredder, granulator, washer, dryer, separator, extruder,
    dehydrator, zig-zag, pelletizer, installed, commissioned, case study, customer reference,
    supplier, capacity, throughput, investment, expansion, automation, new facility]

query_examples:
  - '"Company Name" recycling facility'
  - '"Company Name" WEEE dismantling'
  - '"Company Name" mixed rigid plastics shredding'
  - '"Company Name" washing extrusion pellets'
  - '"Company Name" equipment supplier case study'
  - '"Company Name" permit capacity expansion'
  - 'site:official.example "Company Name" process term'

vocabulary_authority: vocabulary_authority  # selects project_bindings.vocabulary_authority; degrades to use_profile_vocabulary_only when the consuming-project authority is unavailable

relevance:
  scope: preliminary human-review hypothesis only; never a score, ranking, or decision input
  domains: [recycling, plastics recovery, WEEE processing, ELV processing, appliance plastics]
  rule: name plausible equipment or process categories with source-backed reasoning, state the
    missing evidence that could change the assessment, and set review_required true whenever the
    conclusion depends on inference or incomplete coverage

packet_extensions:
  preliminary_relevance:
    placed_at: profile_extensions.preliminary_relevance
    fields:
      equipment_categories: []
      reasoning: ""
      review_required: true
    rule: hypothesis grounded in cited sources above; never exported as a decision

pipeline_binding:
  mode: canonical_candidates_when_supplied
  reference_stages: [Acquisition, Source, Signal, Fact, Score]
  consumes: [Source, Signal]
  produces: [Fact-candidate]
  never_promotes_to: [Score]

project_bindings:
  vocabulary_authority:
    owner: consuming_project
    reference: config/search_terms.yaml
    required: false
    when_unavailable: use_profile_vocabulary_only
  canonical_result_schema:
    owner: consuming_project
    reference: schemas/company_result.schema.json
    required: false
    when_unavailable: review_packet_only
  evidence_store:
    owner: consuming_project
    reference: customer_screening.evidence
    required: false
    when_unavailable: review_packet_only

profile_guidance:
  language_policy:
    executable_language: en
    localized_alias_gates:
      - explicit business approval for the target's local-language research
      - translation review of each alias against its concept, not its label
      - query testing before an alias enters any executed search path
    unapproved_tables: former multilingual tables stay deactivated; they are history, not authority
    language_gap: always recorded as manual_review_reasons metadata

  domain_model:
    chain: input -> internal operation -> output
    optional: true  # a lens for this profile only; findings stay organized by dimensions
    stages: [collection, trading, dismantling, sorting, size reduction, washing, separation,
      extrusion, pelletizing, outsourced downstream work]
    note: query each operation separately; a hit for one stage never proves another

  terminology_map:
    SourceRecord: consuming-project canonical source record; exists only when the pipeline
      supplies it
    source_id: existing canonical identifier copied verbatim from a supplied SourceRecord; never
      derived by hashing or pattern
    EvidenceLink: evidence link binding excerpt, locator, and subject match to a supplied
      SourceRecord
    ev_*: consumer-generated evidence identifier family; this skill never emits one

display:
  display_name: Recycling Company Investigation
  short_description: Evidence-first waste and materials-sector company research
